overrides:
  effect-agent-harness: link:../effect-agent-harness/packages/effect-agent-harness
  effect-agent-harness-monorepo: link:../effect-agent-harness
  # `@effect/platform-node` asks for a caret range, whose newest release needs a newer `effect`.
  "@effect/platform-node-shared": 4.1.4
  # One physical copy of `effect` for the app and the linked library, because a
  # workflow built by one copy can't be run by an engine from the other.
  effect: link:../effect-agent-harness/packages/effect-agent-harness/node_modules/effect
# Durable Streams' dev server: these ship prebuilt binaries, so their build scripts aren't needed.
allowBuilds:
  lmdb: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - "@tanstack/ai-client@1.2.0"
  - "@tanstack/ai-event-client@1.1.0"
  - "@tanstack/ai-react@1.1.0"
  - "@tanstack/ai@1.7.0"
